<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://unpkg.com/lucide@0.468.0"></script>
  <script defer src="login.js"></script>
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
    .auth-container { width: 100%; max-width: 450px; padding: 40px; }
    .auth-tabs { display: flex; gap: 16px; margin-bottom: 32px; border-bottom: 1px solid var(--border-color); padding-bottom: 16px; }
    .auth-tab { flex: 1; text-align: center; font-weight: 600; color: var(--text-muted); cursor: pointer; padding: 8px; transition: color 0.3s; }
    .auth-tab.active { color: var(--primary); border-bottom: 2px solid var(--primary); margin-bottom: -17px; }
    .auth-form { display: none; animation: revealUp 0.4s ease forwards; }
    .auth-form.active { display: block; }
    .brand-center { display: flex; flex-direction: column; align-items: center; margin-bottom: 32px; gap: 16px; }
    .brand-center .logo-icon { width: 64px; height: 64px; font-size: 2rem; }
    .brand-center h1 { font-size: 2rem; font-weight: 700; }
    
    /* Role selector styling */
    .role-selector { display: flex; gap: 12px; margin-bottom: 16px; }
    .role-option { flex: 1; padding: 12px; text-align: center; border: 1px solid var(--border-color); border-radius: 12px; cursor: pointer; transition: all 0.3s; color: var(--text-muted); background: rgba(0,0,0,0.03); }
    body.dark-theme .role-option { background: rgba(0,0,0,0.2); }
    .role-option.active { border-color: var(--primary); background: rgba(79, 70, 229, 0.1); color: var(--primary); font-weight: 600; }
  </style>
</head>
<body class="dark-theme">
  <!-- Animated Background Blobs -->
  <div class="animated-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="glass-panel auth-container reveal">
    <div class="brand-center">
      <div class="logo-icon"><i data-lucide="brain-circuit" style="width: 32px; height: 32px;"></i></div>
      <h1>Nexus AI</h1>
      <p style="text-align: center;">Welcome back. Please log in or create an account to access the system.</p>
    </div>

    <div class="auth-tabs">
      <div class="auth-tab active" data-tab="login">Login</div>
      <div class="auth-tab" data-tab="register">Register</div>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="auth-form active" autocomplete="off">
      <div class="form-group">
        <label for="loginUsername">Username</label>
        <div class="input-wrapper">
          <i data-lucide="user"></i>
          <input id="loginUsername" type="text" placeholder="Enter your username" required>
        </div>
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <div class="input-wrapper">
          <i data-lucide="lock"></i>
          <input id="loginPassword" type="password" placeholder="Enter your password" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-glow full-width" id="loginBtn">
        <span class="btn-text">Authenticate</span>
        <i data-lucide="arrow-right"></i>
        <div class="loader hidden" id="loginLoader"></div>
      </button>
    </form>

    <!-- Register Form -->
    <form id="registerForm" class="auth-form" autocomplete="off">
      <div class="form-group">
        <label>Account Type</label>
        <div class="role-selector">
          <div class="role-option active" data-role="user">
            <i data-lucide="user"></i> Standard User
          </div>
          <div class="role-option" data-role="library">
            <i data-lucide="library"></i> Library
          </div>
        </div>
        <input type="hidden" id="registerRole" value="user">
      </div>
      
      <div class="form-group">
        <label for="registerUsername">Username</label>
        <div class="input-wrapper">
          <i data-lucide="user"></i>
          <input id="registerUsername" type="text" placeholder="Choose a username" required>
        </div>
      </div>
      <div class="form-group">
        <label for="registerPassword">Password</label>
        <div class="input-wrapper">
          <i data-lucide="lock"></i>
          <input id="registerPassword" type="password" placeholder="Choose a password" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-glow full-width" id="registerBtn">
        <span class="btn-text">Create Account</span>
        <i data-lucide="user-plus"></i>
        <div class="loader hidden" id="registerLoader"></div>
      </button>
    </form>
  </div>

  <div class="toast-container" id="toastContainer"></div>

</body>
</html>
