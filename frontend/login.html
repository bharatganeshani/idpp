<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus AI | Sign In</title>
  <meta name="description" content="Sign in to Nexus AI — the intelligent book classification system powered by AI.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <!-- Lucide loaded BEFORE login.js so icons are ready immediately -->
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .auth-container { width: 100%; max-width: 460px; padding: 44px 40px; }
    .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; color: var(--text-muted); font-size: 0.85rem; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border-color); }
    .input-wrapper.focused i { color: var(--primary); }
    .password-toggle {
      position: absolute; right: 14px; cursor: pointer;
      color: var(--text-muted); transition: color 0.2s; background: none; border: none; padding: 0;
    }
    .password-toggle:hover { color: var(--primary); }
    input[type="password"], input[type="text"] { padding-right: 44px; }
    .strength-bar { display: flex; gap: 4px; margin-top: 8px; }
    .strength-segment { flex: 1; height: 3px; border-radius: 2px; background: var(--border-color); transition: background 0.3s; }
    .strength-segment.weak { background: var(--danger); }
    .strength-segment.medium { background: var(--warning); }
    .strength-segment.strong { background: var(--success); }
    .field-hint { font-size: 0.8rem; color: var(--text-muted); margin-top: 6px; }
  </style>
</head>
<body class="dark-theme">
  <div class="animated-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="glass-panel auth-container reveal" id="authCard">
    <div class="brand-center">
      <div class="logo-icon">
        <i data-lucide="brain-circuit" style="width:32px;height:32px;"></i>
      </div>
      <h1>Nexus AI</h1>
      <p>Intelligent book classification powered by AI. Sign in to get started.</p>
    </div>

    <div class="auth-tabs" role="tablist">
      <div class="auth-tab active" data-tab="login" role="tab" id="tab-login">Sign In</div>
      <div class="auth-tab" data-tab="register" role="tab" id="tab-register">Create Account</div>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="auth-form active" autocomplete="off" novalidate>
      <div class="form-group">
        <label for="loginUsername">Username</label>
        <div class="input-wrapper" id="loginUsernameWrapper">
          <i data-lucide="user"></i>
          <input id="loginUsername" type="text" placeholder="Enter your username" required autocomplete="username">
        </div>
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <div class="input-wrapper" id="loginPasswordWrapper">
          <i data-lucide="lock"></i>
          <input id="loginPassword" type="password" placeholder="Enter your password" required autocomplete="current-password">
          <button type="button" class="password-toggle" id="toggleLoginPass" aria-label="Show password">
            <i data-lucide="eye" style="width:18px;height:18px;"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-glow full-width" id="loginBtn">
        <span class="btn-text">Sign In</span>
        <i data-lucide="arrow-right"></i>
        <div class="loader hidden" id="loginLoader"></div>
      </button>
    </form>

    <!-- Register Form -->
    <form id="registerForm" class="auth-form" autocomplete="off" novalidate>
      <div class="form-group">
        <label>Account Type</label>
        <div class="role-selector">
          <div class="role-option active" data-role="user">
            <i data-lucide="user" style="width:16px;height:16px;vertical-align:middle;margin-right:4px;"></i> Standard
          </div>
          <div class="role-option" data-role="library">
            <i data-lucide="library" style="width:16px;height:16px;vertical-align:middle;margin-right:4px;"></i> Library
          </div>
        </div>
        <input type="hidden" id="registerRole" value="user">
      </div>
      <div class="form-group">
        <label for="registerUsername">Username</label>
        <div class="input-wrapper" id="registerUsernameWrapper">
          <i data-lucide="user"></i>
          <input id="registerUsername" type="text" placeholder="Choose a username" required autocomplete="username">
        </div>
      </div>
      <div class="form-group">
        <label for="registerPassword">Password</label>
        <div class="input-wrapper" id="registerPasswordWrapper">
          <i data-lucide="lock"></i>
          <input id="registerPassword" type="password" placeholder="Min. 6 characters" required autocomplete="new-password">
          <button type="button" class="password-toggle" id="toggleRegPass" aria-label="Show password">
            <i data-lucide="eye" style="width:18px;height:18px;"></i>
          </button>
        </div>
        <div class="strength-bar" id="strengthBar">
          <div class="strength-segment" id="seg1"></div>
          <div class="strength-segment" id="seg2"></div>
          <div class="strength-segment" id="seg3"></div>
        </div>
        <p class="field-hint" id="strengthHint">Enter a password to see strength</p>
      </div>
      <button type="submit" class="btn btn-primary btn-glow full-width" id="registerBtn">
        <span class="btn-text">Create Account</span>
        <i data-lucide="user-plus"></i>
        <div class="loader hidden" id="registerLoader"></div>
      </button>
    </form>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="login.js?v=2"></script>
  <script>
    // Password visibility toggles
    function setupToggle(toggleId, inputId) {
      const btn = document.getElementById(toggleId);
      const inp = document.getElementById(inputId);
      if (!btn || !inp) return;
      btn.addEventListener('click', () => {
        const isPass = inp.type === 'password';
        inp.type = isPass ? 'text' : 'password';
        btn.innerHTML = `<i data-lucide="${isPass ? 'eye-off' : 'eye'}" style="width:18px;height:18px;"></i>`;
        if (window.lucide) window.lucide.createIcons();
      });
    }
    setupToggle('toggleLoginPass', 'loginPassword');
    setupToggle('toggleRegPass', 'registerPassword');

    // Password strength meter
    document.getElementById('registerPassword')?.addEventListener('input', (e) => {
      const val = e.target.value;
      const segs = [document.getElementById('seg1'), document.getElementById('seg2'), document.getElementById('seg3')];
      const hint = document.getElementById('strengthHint');
      segs.forEach(s => { s.className = 'strength-segment'; });
      if (val.length === 0) { hint.textContent = 'Enter a password to see strength'; return; }
      let score = 0;
      if (val.length >= 6) score++;
      if (val.length >= 10 && /[A-Z]/.test(val)) score++;
      if (/[0-9]/.test(val) && /[^A-Za-z0-9]/.test(val)) score++;
      const levels = [['weak','Weak — too short'], ['medium','Fair — add numbers or symbols'], ['strong','Strong password!']];
      const [cls, msg] = levels[Math.max(0, score - 1)];
      for (let i = 0; i < score; i++) segs[i].classList.add(cls);
      hint.textContent = msg;
    });

    // Focus wrappers
    document.querySelectorAll('input').forEach(inp => {
      inp.addEventListener('focus', () => inp.closest('.input-wrapper')?.classList.add('focused'));
      inp.addEventListener('blur', () => inp.closest('.input-wrapper')?.classList.remove('focused'));
    });

    // Init icons after everything loads
    if (window.lucide) window.lucide.createIcons();
  </script>
</body>
</html>
